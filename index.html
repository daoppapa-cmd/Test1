    <!-- ភ្ជាប់ Firebase -->
    <script type="module">
        // នាំចូល Functions ពី Firebase SDKs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInAnonymously, 
            signInWithCustomToken, 
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc, 
            updateDoc, 
            collection, 
            query, 
            where,
            getDocs,
            onSnapshot,
            setLogLevel
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Config ពី platform-provided variable ឬ fallback ទៅ config ដែលបានផ្តល់
        // ប្រើ Config ដែលអ្នកបានផ្តល់ឱ្យជា fallback
        const userProvidedConfig = {
            apiKey: "AIzaSyA3LPVD0nRfMuEoQSCs5HiwztRmlWqw--c",
            authDomain: "checkinme-305e8.firebaseapp.com",
            projectId: "checkinme-305e8",
            storageBucket: "checkinme-305e8.firebasestorage.app",
            messagingSenderId: "702908288371",
            appId: "1:702908288371:web:bb067e1a238bd1e5288906",
            measurementId: "G-ZFFWRTD6QE"
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : userProvidedConfig;
            
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-checkin-app';

        // ថតទុក Global Variables
        let app, db, auth;
        let currentUserId = null;
        let currentEmployeeProfile = null;
        let allEmployees = []; // សម្រាប់ផ្ទុកបញ្ជីបុគ្គលិកទាំងអស់
        let attendanceHistory = []; // សម្រាប់ផ្ទុកប្រវត្តិវត្តមាន

        // Google Sheet Info
        const sheetId = '1eRyPoifzyvB4oBmruNyXcoKMKPRqjk6xDD6-bPNW6pc';
        const sheetName = 'DIList';
        // E=4, L=11, R=17, AA=26
        const sheetRange = 'A9:AA';
        const gvizUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${sheetName}&range=${sheetRange}`;

        // យក DOM Elements
        const mainLoader = document.getElementById('main-loader');
        const profileSelectionPage = document.getElementById('profile-selection-page');
        const mainAppPage = document.getElementById('main-app-page');
        const employeeListContainer = document.getElementById('employee-list-container');
        const searchBar = document.getElementById('search-bar');
        const noResultsDiv = document.getElementById('no-results');

        // Main App Elements
        const profilePhoto = document.getElementById('profile-photo');
        const profileName = document.getElementById('profile-name');
        const profileId = document.getElementById('profile-id');
        const profileDepartment = document.getElementById('profile-department');
        const checkInButton = document.getElementById('check-in-button');
        const checkOutButton = document.getElementById('check-out-button');
        const checkInStatus = document.getElementById('check-in-status');
        const checkOutStatus = document.getElementById('check-out-status');
        const logoutButton = document.getElementById('logout-button');

        // Navigation Elements
        const navCheckIn = document.getElementById('nav-check-in');
        const navHistory = document.getElementById('nav-history');
        const checkInTab = document.getElementById('check-in-tab');
        const historyTab = document.getElementById('history-tab');
        
        // History Elements
        const historyListDiv = document.getElementById('history-list');
        const historyLoading = document.getElementById('history-loading');
        const noHistory = document.getElementById('no-history');
        const historyFilter = document.getElementById('history-filter');

        // Modal Elements
        const messageModal = document.getElementById('message-modal');
        const modalMessage = document.getElementById('modal-message');
        const modalCloseButton = document.getElementById('modal-close-button');
        
        // Modal បញ្ជាក់
        const confirmModal = document.getElementById('confirm-modal');
        const confirmMessage = document.getElementById('confirm-message');
        const confirmYesButton = document.getElementById('confirm-yes-button');
        const confirmNoButton = document.getElementById('confirm-no-button');
        
        let onConfirmCallback = null; // សម្រាប់เก็บ callback function ពេលចុច Yes
        
        // --- Helper Functions ---

        // បង្ហាញ Modal សារ (សម្រាប់ OK)
        function showMessage(message) {
            modalMessage.textContent = message;
            messageModal.classList.remove('hidden');
        }

        // បង្ហាញ Modal បញ្ជាក់ (សម្រាប់ Yes/No)
        function showConfirm(message, callback) {
            confirmMessage.textContent = message;
            onConfirmCallback = callback;
            confirmModal.classList.remove('hidden');
        }

        // ផ្លាស់ប្តូរ Format ម៉ោង (e.g., 08:05 AM)
        function formatTime(isoString) {
            if (!isoString) return "N/A";
            try {
                const date = new Date(isoString);
                return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            } catch (e) {
                console.error("Error formatting time:", e);
                return "Invalid Date";
            }
        }
        
        // ផ្លាស់ប្តូរ Format ថ្ងៃ (e.g., 30-Oct-2025)
        function formatDate(isoString) {
             if (!isoString) return "N/A";
             try {
                const date = new Date(isoString);
                return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            } catch (e) {
                console.error("Error formatting date:", e);
                return "Invalid Date";
            }
        }

        // យកថ្ងៃ ខែ ឆ្នាំ បច្ចុប្បន្ន ជា Format YYYY-MM-DD
        function getTodayDateString() {
            const today = new Date();
            const year = today.getFullYear();
            const month = (today.getMonth() + 1).toString().padStart(2, '0');
            const day = today.getDate().toString().padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // --- Firebase Functions ---

        // ចាប់ផ្តើម Firebase និង Authentication
        async function initializeFirebase() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                setLogLevel('debug'); // សម្រាប់ Debugging

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        console.log("User is signed in:", user.uid);
                        currentUserId = user.uid;
                        await checkUserProfile(currentUserId);
                    } else {
                        console.log("User is signed out. Attempting sign in...");
                        currentUserId = null;
                        try {
                            if (typeof __initial_auth_token !== 'undefined') {
                                console.log("Signing in with custom token...");
                                await signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                console.log("Signing in anonymously...");
                                await signInAnonymously(auth);
                            }
                        } catch (authError) {
                            console.error("Firebase Auth Error:", authError);
                            showMessage("មិនអាចភ្ជាប់ទៅសេវាកម្ម 인증 បានទេ។");
                        }
                    }
                });

            } catch (e) {
                console.error("Error initializing Firebase:", e);
                mainLoader.textContent = "Error initializing app.";
            }
        }

        // ពិនិត្យមើលថាតើ User មាន Profile ក្នុង Firestore រួចហើយឬនៅ
        async function checkUserProfile(userId) {
            if (!userId) return;
            // [FIX] ផ្លូវ (Path) ត្រូវតែមាន 6 segments សម្រាប់ document reference
            const profileRef = doc(db, `artifacts/${appId}/users/${userId}/user_data/profile`);
            
            try {
                const docSnap = await getDoc(profileRef);
                // [FIX] ពិនិត្យមើលថា docSnap.data() មិនទទេ (ករណី logout)
                if (docSnap.exists() && docSnap.data().id) {
                    console.log("User profile found:", docSnap.data());
                    currentEmployeeProfile = docSnap.data();
                    // បង្ហាញផ្ទាំងកម្មវិធី chính
                    await showMainApp(currentEmployeeProfile);
                } else {
                    console.log("No user profile found or profile is empty. Loading employee list.");
                    // បើមិនមាន ទៅផ្ទាំងជ្រើសរើស Profile
                    await loadEmployeeListFromGSheet();
                }
            } catch (e) {
                console.error("Error checking user profile:", e);
                showMessage("មានបញ្ហាក្នុងការទាញយកគណនី។");
            } finally {
                mainLoader.classList.add('hidden');
            }
        }

        // រក្សាទុក Profile ដែលបានជ្រើសរើស
        async function selectEmployeeProfile(employee) {
            if (!currentUserId) {
                showMessage("មិនមានគណនី។ សូមព្យាយាមម្តងទៀត។");
                return;
            }
            
            mainLoader.classList.remove('hidden');
            // [FIX] ផ្លូវ (Path) ត្រូវតែមាន 6 segments សម្រាប់ document reference
            const profileRef = doc(db, `artifacts/${appId}/users/${currentUserId}/user_data/profile`);
            
            try {
                await setDoc(profileRef, employee);
                currentEmployeeProfile = employee;
                console.log("Profile saved:", employee);
                await showMainApp(currentEmployeeProfile);
            } catch (e) {
                console.error("Error saving profile:", e);
                showMessage("មានបញ្ហាក្នុងការរក្សាទុកគណនី។");
            } finally {
                mainLoader.classList.add('hidden');
            }
        }
        
        // ធ្វើការ Check In
        async function handleCheckIn() {
            if (!currentUserId || !currentEmployeeProfile) return;
            
            checkInButton.disabled = true;
            const todayDate = getTodayDateString();
            const checkInTime = new Date().toISOString();
            // ផ្លូវនេះត្រឹមត្រូវ (6 segments)
            const attendanceRef = doc(db, `artifacts/${appId}/users/${currentUserId}/attendance`, todayDate);
            
            const attendanceData = {
                date: todayDate,
                employeeId: currentEmployeeProfile.id,
                name: currentEmployeeProfile.name,
                checkIn: checkInTime,
                checkOut: null
            };
            
            try {
                await setDoc(attendanceRef, attendanceData, { merge: true });
                console.log("Checked in successfully");
                showMessage(`បាន${checkInButton.textContent}ដោយជោគជ័យនៅម៉ោង ${formatTime(checkInTime)}`);
                updateTodayState(attendanceData);
            } catch (e) {
                console.error("Error checking in:", e);
                showMessage("មានបញ្ហាក្នុងការ Check In។");
                checkInButton.disabled = false;
            }
        }
        
        // ធ្វើការ Check Out
        async function handleCheckOut() {
            if (!currentUserId) return;
            
            checkOutButton.disabled = true;
            const todayDate = getTodayDateString();
            const checkOutTime = new Date().toISOString();
            // ផ្លូវនេះត្រឹមត្រូវ (6 segments)
            const attendanceRef = doc(db, `artifacts/${appId}/users/${currentUserId}/attendance`, todayDate);
            
            try {
                await updateDoc(attendanceRef, { checkOut: checkOutTime });
                console.log("Checked out successfully");
                showMessage(`បាន${checkOutButton.textContent}ដោយជោគជ័យនៅម៉ោង ${formatTime(checkOutTime)}`);
                checkOutStatus.textContent = formatTime(checkOutTime);
                checkOutStatus.classList.remove('text-red-600');
                checkOutStatus.classList.add('text-gray-800');
            } catch (e) {
                console.error("Error checking out:", e);
                showMessage("មានបញ្ហាក្នុងការ Check Out។");
                checkOutButton.disabled = false; // បើកវិញបើមានបញ្ហា
            }
        }
        
        // ទាញយកស្ថានភាព Check-in/out ថ្ងៃនេះ
        async function loadTodayState() {
            if (!currentUserId) return;
            
            const todayDate = getTodayDateString();
            // ផ្លូវនេះត្រឹមត្រូវ (6 segments)
            const attendanceRef = doc(db, `artifacts/${appId}/users/${currentUserId}/attendance`, todayDate);
            
            try {
                // ប្រើ onSnapshot ដើម្បីស្តាប់ការផ្លាស់ប្តូរ Real-time
                onSnapshot(attendanceRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        console.log("Today's data:", data);
                        updateTodayState(data);
                    } else {
                        console.log("No attendance record for today.");
                        updateTodayState(null);
                    }
                });
            } catch (e) {
                console.error("Error loading today's state:", e);
            }
        }
        
        // Update UI ផ្អែកលើទិន្នន័យថ្ងៃនេះ
        function updateTodayState(data) {
            if (data && data.checkIn) {
                checkInStatus.textContent = formatTime(data.checkIn);
                checkInStatus.classList.remove('text-green-600');
                checkInStatus.classList.add('text-gray-800');
                checkInButton.disabled = true;
                checkOutButton.disabled = !!data.checkOut; // Disable បើ checkOut រួច
            } else {
                checkInStatus.textContent = "មិនទាន់បានចូល";
                checkInStatus.classList.add('text-green-600');
                checkInButton.disabled = false;
                checkOutButton.disabled = true; // មិនអាច Check Out បើមិនទាន់ Check In
            }
            
            if (data && data.checkOut) {
                checkOutStatus.textContent = formatTime(data.checkOut);
                checkOutStatus.classList.remove('text-red-600');
                checkOutStatus.classList.add('text-gray-800');
                checkOutButton.disabled = true;
            } else if (data && data.checkIn) {
                // Check in រួច តែមិនទាន់ Check out
                checkOutStatus.textContent = "មិនទាន់បានចេញ";
                checkOutStatus.classList.add('text-red-600');
                checkOutButton.disabled = false;
            } else {
                // មិនទាន់ Check in
                checkOutStatus.textContent = "មិនទាន់បានចេញ";
                checkOutStatus.classList.add('text-red-600');
                checkOutButton.disabled = true;
            }
        }
        
        // ទាញយកប្រវត្តិវត្តមានទាំងអស់
        async function loadAttendanceHistory() {
            if (!currentUserId) return;
            
            historyLoading.classList.remove('hidden');
            historyListDiv.innerHTML = '';
            noHistory.classList.add('hidden');
            
            // ផ្លូវនេះត្រឹមត្រូវ (5 segments)
            const historyCollectionRef = collection(db, `artifacts/${appId}/users/${currentUserId}/attendance`);
            const q = query(historyCollectionRef);
            
            try {
                const querySnapshot = await getDocs(q);
                attendanceHistory = [];
                querySnapshot.forEach((doc) => {
                    attendanceHistory.push(doc.data());
                });
                
                // Sort ក្នុង JavaScript (ថ្មីមុន) ព្រោះ Firestore orderBy ត្រូវការ Index
                attendanceHistory.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                renderHistory(attendanceHistory);
                
            } catch (e) {
                console.error("Error loading history:", e);
                historyLoading.textContent = "Error loading history.";
            }
        }
        
        // បង្ហាញប្រវត្តិក្នុង UI
        function renderHistory(historyData) {
            historyLoading.classList.add('hidden');
            historyListDiv.innerHTML = '';
            
            if (historyData.length === 0) {
                noHistory.classList.remove('hidden');
                return;
            }
            
            noHistory.classList.add('hidden');
            
            historyData.forEach(record => {
                const item = document.createElement('div');
                item.className = 'p-3 border-b border-gray-100 flex justify-between items-center hover:bg-gray-50';
                item.innerHTML = `
                    <div>
                        <p class="font-semibold">${formatDate(record.date)}</p>
                        <p class="text-sm text-gray-500">${record.name}</p>
                    </div>
                    <div class_name="text-right text-sm space-y-1">
                        <p class="text-green-600 font-medium">ចូល: ${formatTime(record.checkIn)}</p>
                        <p class="text-red-600 font-medium">ចេញ: ${formatTime(record.checkOut) || 'N/A'}</p>
                    </div>
                `;
                historyListDiv.appendChild(item);
            });
        }
        
        // --- Google Sheet Functions ---

        // ទាញយកបញ្ជីបុគ្គលិកពី Google Sheet
        async function loadEmployeeListFromGSheet() {
            mainLoader.classList.remove('hidden');
            try {
                const response = await fetch(gvizUrl);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                let text = await response.text();
                
                // ដក `google.visualization.Query.setResponse(` ចេញ
                const jsonText = text.substring(text.indexOf('(') + 1, text.lastIndexOf(')'));
                const data = JSON.parse(jsonText);
                
                if (!data.table || !data.table.rows) {
                    throw new Error("Invalid Google Sheet data format.");
                }

                allEmployees = data.table.rows
                    .map(row => {
                        // E=4, L=11, R=17, AA=26
                        const idCell = row.c[4];
                        const nameCell = row.c[11];
                        const departmentCell = row.c[17];
                        const photoCell = row.c[26];

                        // ត្រូវប្រាកដថា ID និង Name មិន Null
                        if (!idCell || !idCell.v || !nameCell || !nameCell.v) {
                            return null;
                        }

                        return {
                            id: idCell.v.toString(),
                            name: nameCell.v.toString(),
                            department: (departmentCell && departmentCell.v) ? departmentCell.v.toString() : 'N/A',
                            photo: (photoCell && photoCell.v) ? photoCell.v.toString() : null
                        };
                    })
                    .filter(emp => emp !== null); // ត្រងយកតែអ្វីដែលមាន

                console.log(`Loaded ${allEmployees.length} employees.`);
                renderEmployeeList(allEmployees);
                profileSelectionPage.classList.remove('hidden');

            } catch (e) {
                console.error("Error loading Google Sheet:", e);
                showMessage("មានបញ្ហាក្នុងការទាញយកបញ្ជីបុគ្គលិក។");
            } finally {
                mainLoader.classList.add('hidden');
            }
        }
        
        // បង្ហាញបញ្ជីបុគ្គលិកក្នុង UI
        function renderEmployeeList(employees) {
            employeeListContainer.innerHTML = '';
            
            if (employees.length === 0) {
                noResultsDiv.classList.remove('hidden');
                return;
            }
            
            noResultsDiv.classList.add('hidden');
            
            employees.forEach(emp => {
                const card = document.createElement('div');
                card.className = 'bg-white p-3 rounded-xl shadow-md cursor-pointer hover:shadow-lg transition-all duration-300 transform hover:-translate-y-1 overflow-hidden';
                card.innerHTML = `
                    <img src="${emp.photo || 'https://placehold.co/100x100/EBF4FF/76A9FA?text=រូបថត'}" 
                         onerror="this.src='https://placehold.co/100x100/EBF4FF/76A9FA?text=រូបថត'"
                         class="w-full h-24 object-cover rounded-lg mb-2">
                    <p class="font-semibold text-sm truncate">${emp.name}</p>
                    <p class="text-xs text-gray-500 truncate">${emp.id}</p>
                `;
                // បន្ថែម Event ពេលចុច
                card.onclick = () => {
                    // ប្រើ Modal បញ្ជាក់ ជំនួស confirm()
                    showConfirm(`តើអ្នកចង់ចូលគណនី ${emp.name} មែនទេ?`, () => {
                        selectEmployeeProfile(emp);
                    });
                };
                employeeListContainer.appendChild(card);
            });
        }
        
        // --- UI Control Functions ---
        
        // បង្ហាញផ្ទាំងកម្មវិធី chính និងលាក់ផ្ទាំងជ្រើសរើស
        async function showMainApp(profile) {
            // បំពេញព័ត៌មាន Profile
            profilePhoto.src = profile.photo || 'https://placehold.co/100x100/EBF4FF/76A9FA?text=រូបថត';
            profileName.textContent = profile.name;
            profileId.textContent = `អត្តលេខ: ${profile.id}`;
            profileDepartment.textContent = `ផ្នែក: ${profile.department}`;
            
            // បង្ហាញ/លាក់ផ្ទាំង
            profileSelectionPage.classList.add('hidden');
            mainAppPage.classList.remove('hidden');
            mainAppPage.classList.add('flex');
            
            // ទាញយកស្ថានភាពថ្ងៃនេះ
            await loadTodayState();
            // ទាញយកប្រវត្តិ
            await loadAttendanceHistory();
        }

        // គ្រប់គ្រងការប្តូរផ្ទាំង (Navigation)
        function handleNavigation(target) {
            // Reset គ្រប់ប៊ូតុង
            document.querySelectorAll('.nav-button').forEach(btn => {
                btn.classList.remove('text-blue-600', 'border-blue-600');
                btn.classList.add('text-gray-500', 'border-transparent');
            });
            
            // Reset គ្រប់ផ្ទាំង
            checkInTab.classList.add('hidden');
            historyTab.classList.add('hidden');
            
            if (target === 'history') {
                // Active ផ្ទាំងប្រវត្តិ
                navHistory.classList.add('text-blue-600', 'border-blue-600');
                navHistory.classList.remove('text-gray-500', 'border-transparent');
                historyTab.classList.remove('hidden');
                // ផ្ទុកប្រវត្តិឡើងវិញ ពេលចុច
                loadAttendanceHistory(); 
            } else {
                // Active ផ្ទាំង Check-in (លំនាំដើម)
                navCheckIn.classList.add('text-blue-600', 'border-blue-600');
                navCheckIn.classList.remove('text-gray-500', 'border-transparent');
                checkInTab.classList.remove('hidden');
            }
        }
        
        // គ្រប់គ្រងការ Logout/ប្តូរគណនី
        async function handleLogout() {
             if (!currentUserId) return;
            
            // បង្ហាញ Modal បញ្ជាក់
            showConfirm("តើអ្នកពិតជាចង់ប្តូរគណនីមែនទេ?", async () => {
                // Logic នេះនឹងដំណើរការតែពេល User ចុច "បាទ/ចាស"
                mainLoader.classList.remove('hidden');
                // [FIX] ផ្លូវ (Path) ត្រូវតែមាន 6 segments
                const profileRef = doc(db, `artifacts/${appId}/users/${currentUserId}/user_data/profile`);
                
                try {
                    // កំណត់ profile ទៅជាទទេ
                    await setDoc(profileRef, {}); 
                    currentEmployeeProfile = null;
                    
                    // [FIX] លាក់ផ្ទាំង App ហើយបង្ហាញផ្ទាំងជ្រើសរើសគណនី (មិន Reload)
                    mainAppPage.classList.add('hidden');
                    mainAppPage.classList.remove('flex');
                    profileSelectionPage.classList.remove('hidden');
                    
                } catch (e) {
                    console.error("Error switching account:", e);
                    showMessage("មានបញ្ហាក្នុងការប្តូរគណនី។");
                } finally {
                    mainLoader.classList.add('hidden');
                }
            });
        }

        // --- Event Listeners ---
        
        // ចាប់ផ្តើមកម្មវិធីពេល Page ផ្ទុកចប់
        window.addEventListener('load', initializeFirebase);
        
        // ប៊ូតុង Modal
        modalCloseButton.addEventListener('click', () => {
            messageModal.classList.add('hidden');
        });

        // ប៊ូតុង Modal បញ្ជាក់
        confirmNoButton.addEventListener('click', () => {
            confirmModal.classList.add('hidden');
            onConfirmCallback = null;
        });
        
        confirmYesButton.addEventListener('click', () => {
            confirmModal.classList.add('hidden');
            if (onConfirmCallback) {
                onConfirmCallback(); // ដំណើរការ function ដែលបានកំណត់
            }
            onConfirmCallback = null;
        });

        // ប៊ូតុង Check In / Out
        checkInButton.addEventListener('click', handleCheckIn);
        checkOutButton.addEventListener('click', handleCheckOut);

        // ប៊ូតុង Logout
        logoutButton.addEventListener('click', handleLogout); // ហៅ function ថ្មី

        // ផ្ទាំង Navigation
        navCheckIn.addEventListener('click', () => handleNavigation('check-in'));
        navHistory.addEventListener('click', () => handleNavigation('history'));

        // ផ្ទាំងស្វែងរក
        searchBar.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase().trim();
            if (searchTerm === '') {
                renderEmployeeList(allEmployees);
                return;
            }
            
            const filtered = allEmployees.filter(emp => 
                emp.name.toLowerCase().includes(searchTerm) ||
                emp.id.toLowerCase().includes(searchTerm)
            );
            renderEmployeeList(filtered);
        });
        
        // ហ្វਿਲធ័រប្រវត្តិ
        historyFilter.addEventListener('change', (e) => {
            const selectedDate = e.target.value; // YYYY-MM-DD
            if (!selectedDate) {
                renderHistory(attendanceHistory); // បង្ហាញទាំងអស់បើគ្មានថ្ងៃ
                return;
            }
            
            const filtered = attendanceHistory.filter(record => record.date === selectedDate);
            renderHistory(filtered);
        });

    </script>
