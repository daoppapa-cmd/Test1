<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធវត្តមាន</title>
    <!-- ភ្ជាប់ Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ប្រើប្រាស់ Font "Inter" ឬ Font ខ្មែរ "Kantumruy Pro" -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* អនុវត្ត Font សម្រាប់កម្មវិធីទាំងមូល */
        body {
            font-family: 'Inter', 'Kantumruy Pro', sans-serif;
        }
        /* លាក់ scrollbar សម្រាប់ webkit */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* លាក់ scrollbar សម្រាប់ IE, Edge, Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Main Application Container -->
    <div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-lg">

        <!-- 1. View: Loading Screen -->
        <div id="loading-view" class="flex flex-col items-center justify-center min-h-screen p-4">
            <svg class="animate-spin h-12 w-12 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p id="loading-text" class="mt-4 text-lg font-semibold text-gray-700">កំពុងទាញទិន្នន័យ...</p>
        </div>

        <!-- 2. View: User Selection -->
        <div id="user-selection-view" class="p-4 hidden min-h-screen flex flex-col">
            <h1 class="text-2xl font-bold text-center text-blue-700 mb-4">ជ្រើសរើសគណនីរបស់អ្នក</h1>
            <div class="relative mb-4">
                <input type="text" id="search-bar"
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="ស្វែងរកតាមឈ្មោះ ឬអត្តលេខ...">
                <svg class="w-5 h-5 text-gray-400 absolute right-4 top-3.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
            <div id="employee-list" class="flex-1 overflow-y-auto no-scrollbar space-y-3">
                <!-- Employee cards will be injected here by JS -->
            </div>
        </div>

        <!-- 3. View: Main Application -->
        <div id="main-app-view" class="p-4 hidden min-h-screen flex flex-col">
            <!-- Header -->
            <div class="flex justify-between items-center mb-4">
                <h1 id="welcome-message" class="text-xl font-bold text-blue-700">សូមស្វាគមន៍!</h1>
                <button id="logout-btn" class="text-sm font-medium text-red-600 hover:text-red-800">ចាកចេញ</button>
            </div>

            <!-- User Profile Card -->
            <div id="user-profile-card" class="bg-gray-50 p-4 rounded-lg shadow-md mb-6 flex items-center space-x-4">
                <img id="profile-photo" src="" alt="រូបថត" class="w-16 h-16 rounded-full object-cover border-2 border-blue-500"
                     onerror="this.src='https://placehold.co/64x64/e0e0e0/777?text=No+Img'">
                <div>
                    <h2 id="profile-name" class="text-lg font-semibold text-gray-900"></h2>
                    <p id="profile-id" class="text-sm text-gray-600"></p>
                    <p id="profile-dept" class="text-sm text-gray-600"></p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <button id="check-in-btn"
                        class="w-full bg-green-600 text-white font-bold py-4 rounded-lg shadow-lg hover:bg-green-700 transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
                    ចុះវត្តមានចូល
                </button>
                <button id="check-out-btn"
                        class="w-full bg-red-600 text-white font-bold py-4 rounded-lg shadow-lg hover:bg-red-700 transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
                    ចុះវត្តមានចេញ
                </button>
            </div>
            <p id="status-message" class="text-center text-gray-700 mb-6 h-5"></p>

            <!-- Attendance History -->
            <div class="flex-1 flex flex-col">
                <h3 class="text-lg font-semibold text-gray-800 mb-3">ប្រវត្តិវត្តមាន</h3>
                <div class="mb-4">
                    <label for="date-filter" class="block text-sm font-medium text-gray-700 mb-1">ត្រងតាមកាលបរិច្ឆេទ:</label>
                    <input type="date" id="date-filter" class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex-1 overflow-y-auto no-scrollbar border rounded-lg">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50 sticky top-0">
                            <tr>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">កាលបរិច្ឆេទ</th>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ចូល</th>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ចេញ</th>
                            </tr>
                        </thead>
                        <tbody id="history-list" class="bg-white divide-y divide-gray-200">
                            <!-- History rows will be injected here -->
                            <tr>
                                <td colspan="3" class="px-4 py-4 text-center text-gray-500">មិនទាន់មានទិន្នន័យ</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Message Modal (Custom Alert) -->
    <div id="message-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl p-6 max-w-sm w-full">
            <h3 id="message-title" class="text-lg font-bold mb-4"></h3>
            <p id="message-body" class="text-gray-700 mb-6"></p>
            <button id="message-close-btn" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-300">
                យល់ព្រម
            </button>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        // នាំចូល Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInAnonymously, 
            signInWithCustomToken, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc, 
            updateDoc, 
            collection, 
            onSnapshot,
            setLogLevel
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Global Variables ---
        let db, auth, appId;
        let allEmployees = []; // ផ្ទុកបុគ្គលិកទាំងអស់ពី Google Sheet
        let globalAttendanceList = []; // ផ្ទុកប្រវត្តិវត្តមានទាំងអស់
        let currentUser = null; // បុគ្គលិកដែលបានជ្រើសរើស
        let attendanceCollectionRef = null; // Reference ទៅ Firestore collection
        let attendanceListener = null; // Unsubscribe function សម្រាប់ onSnapshot

        // --- Google Sheet Configuration ---
        const SHEET_ID = '1eRyPoifzyvB4oBmruNyXcoKMKPRqjk6xDD6-bPNW6pc';
        const SHEET_NAME = 'DIList';
        // Range E9:AA (Column E ដល់ AA, ចាប់ពីជួរទី 9)
        // E=col 0, L=col 7, R=col 13, AA=col 22
        const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}&range=E9:AA`;
        const COL_INDEX = {
            ID: 0,        // Column E
            NAME: 7,      // Column L
            DEPT: 13,     // Column R
            PHOTO: 22     // Column AA
        };

        // --- Firebase Configuration ---
        // ប្រើអថេរដែលបានផ្តល់ដោយបរិស្ថាន (environment)
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        // --- DOM Elements ---
        const loadingView = document.getElementById('loading-view');
        const loadingText = document.getElementById('loading-text');
        const userSelectionView = document.getElementById('user-selection-view');
        const mainAppView = document.getElementById('main-app-view');
        const searchBar = document.getElementById('search-bar');
        const employeeListEl = document.getElementById('employee-list');
        const welcomeMessage = document.getElementById('welcome-message');
        const logoutBtn = document.getElementById('logout-btn');
        const profilePhoto = document.getElementById('profile-photo');
        const profileName = document.getElementById('profile-name');
        const profileId = document.getElementById('profile-id');
        const profileDept = document.getElementById('profile-dept');
        const checkInBtn = document.getElementById('check-in-btn');
        const checkOutBtn = document.getElementById('check-out-btn');
        const statusMessage = document.getElementById('status-message');
        const dateFilter = document.getElementById('date-filter');
        const historyListEl = document.getElementById('history-list');
        
        // Message Modal Elements
        const messageModal = document.getElementById('message-modal');
        const messageTitle = document.getElementById('message-title');
        const messageBody = document.getElementById('message-body');
        const messageCloseBtn = document.getElementById('message-close-btn');

        // --- Helper Functions ---

        /**
         * បង្ហាញ Loading Overlay
         * @param {boolean} isLoading 
         * @param {string} text 
         */
        function showLoading(isLoading, text = 'កំពុងដំណើរការ...') {
            if (isLoading) {
                loadingText.textContent = text;
                loadingView.classList.remove('hidden');
                loadingView.classList.add('flex');
            } else {
                loadingView.classList.add('hidden');
                loadingView.classList.remove('flex');
            }
        }

        /**
         * បង្ហាញ Modal សារ
         * @param {string} title 
         * @param {string} body 
         * @param {boolean} isError 
         */
        function showMessage(title, body, isError = false) {
            messageTitle.textContent = title;
            messageBody.textContent = body;
            messageTitle.classList.toggle('text-red-600', isError);
            messageTitle.classList.toggle('text-blue-700', !isError);
            messageModal.classList.remove('hidden');
        }

        /**
         * បិទ Modal សារ
         */
        function closeMessage() {
            messageModal.classList.add('hidden');
        }

        /**
         * យកកាលបរិច្ឆេទថ្ងៃនេះជាទម្រង់ YYYY-MM-DD
         * @param {Date} date 
         * @returns {string}
         */
        function getTodayDateString(date = new Date()) {
            return date.toISOString().split('T')[0];
        }

        /**
         * បំប្លែង ISO string ទៅជា HH:MM:SS
         * @param {string} isoString 
         * @returns {string}
         */
        function formatTime(isoString) {
            if (!isoString) return '--:--:--';
            try {
                return new Date(isoString).toLocaleTimeString('en-GB'); // ប្រើ 'en-GB' សម្រាប់ទម្រង់ 24 ម៉ោង
            } catch (e) {
                console.error('Invalid date string:', isoString);
                return 'Invalid Time';
            }
        }

        // --- Main Functions ---

        /**
         * 1. ចាប់ផ្តើម Firebase
         */
        async function initializeAppFirebase() {
            try {
                // ប្រើ config ដែលបានផ្តល់ឱ្យ ជំនួស __firebase_config
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                setLogLevel('debug'); // សម្រាប់ Debugging
                
                // យក App ID ពី environment
                appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

                await setupAuthListener();
            } catch (error) {
                console.error("Firebase Init Error:", error);
                showMessage('បញ្ហាធ្ងន់ធ្ងរ', `មិនអាចភ្ជាប់ទៅ Firebase បានទេ: ${error.message}`, true);
            }
        }

        /**
         * 2. ផ្ទៀងផ្ទាត់អ្នកប្រើ (Sign in)
         */
        async function setupAuthListener() {
            return new Promise((resolve, reject) => {
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        // User is signed in
                        console.log('Firebase Auth user signed in:', user.uid);
                        // ពេល Sign in ជោគជ័យ, ចាប់ផ្តើមទាញទិន្នន័យ Google Sheet
                        await fetchGoogleSheetData();
                        resolve();
                    } else {
                        // User is signed out, attempt to sign in
                        try {
                            if (initialAuthToken) {
                                await signInWithCustomToken(auth, initialAuthToken);
                            } else {
                                await signInAnonymously(auth);
                            }
                        } catch (error) {
                            console.error("Firebase Sign In Error:", error);
                            showMessage('បញ្ហា Sign In', `មិនអាច Sign In ទៅ Firebase បានទេ: ${error.message}`, true);
                            reject(error);
                        }
                    }
                });
            });
        }

        /**
         * 3. ទាញទិន្នន័យពី Google Sheet
         */
        async function fetchGoogleSheetData() {
            showLoading(true, 'កំពុងទាញបញ្ជីបុគ្គលិក...');
            try {
                const response = await fetch(GVIZ_URL);
                if (!response.ok) {
                    throw new Error(`Network response was not ok (${response.status})`);
                }
                let text = await response.text();
                
                // ដក JSONP wrapper ចេញ
                const jsonText = text.match(/google\.visualization\.Query\.setResponse\((.*)\);/s);
                if (!jsonText || !jsonText[1]) {
                    throw new Error('Invalid Gviz response format.');
                }
                
                const data = JSON.parse(jsonText[1]);
                
                if (data.status === 'error') {
                    throw new Error(`Google Sheet Error: ${data.errors.map(e => e.detailed_message).join(', ')}`);
                }

                allEmployees = data.table.rows
                    .map(row => {
                        const cells = row.c;
                        // ត្រូវប្រាកដថា ID មាន
                        const id = cells[COL_INDEX.ID]?.v;
                        if (!id) {
                            return null;
                        }
                        return {
                            id: String(id).trim(),
                            name: cells[COL_INDEX.NAME]?.v || 'N/A',
                            department: cells[COL_INDEX.DEPT]?.v || 'N/A',
                            photoUrl: cells[COL_INDEX.PHOTO]?.v || null
                        };
                    })
                    .filter(emp => emp !== null); // ដកជួរណាដែលគ្មាន ID

                console.log(`Loaded ${allEmployees.length} employees.`);
                renderEmployeeList(allEmployees);
                
                // ប្តូរ View
                showLoading(false);
                userSelectionView.classList.remove('hidden');
                userSelectionView.classList.add('flex');
                loadingView.classList.add('hidden');
                loadingView.classList.remove('flex');
                mainAppView.classList.add('hidden');
                
            } catch (error) {
                console.error('Fetch Google Sheet Error:', error);
                showLoading(false);
                showMessage('បញ្ហាទាញទិន្នន័យ', `មិនអាចទាញទិន្នន័យពី Google Sheet បានទេ។ សូមប្រាកដថា Sheet ត្រូវបាន Publish to the web។ Error: ${error.message}`, true);
            }
        }

        /**
         * 4. បង្ហាញបញ្ជីបុគ្គលិក
         * @param {Array} employees 
         */
        function renderEmployeeList(employees) {
            employeeListEl.innerHTML = ''; // សម្អាត list ចាស់
            if (employees.length === 0) {
                employeeListEl.innerHTML = `<p class="text-center text-gray-500">រកមិនឃើញបុគ្គលិកទេ។</p>`;
                return;
            }

            employees.forEach(emp => {
                const card = document.createElement('div');
                card.className = 'flex items-center p-3 bg-white border border-gray-200 rounded-lg shadow-sm hover:bg-gray-50 cursor-pointer';
                card.innerHTML = `
                    <img src="${emp.photoUrl || 'https://placehold.co/48x48/e0e0e0/777?text=No+Img'}" 
                         alt="រូបថត" 
                         class="w-12 h-12 rounded-full object-cover mr-4"
                         onerror="this.src='https://placehold.co/48x48/e0e0e0/777?text=No+Img'">
                    <div>
                        <p class="text-md font-semibold text-gray-800">${emp.name}</p>
                        <p class="text-sm text-gray-500">ID: ${emp.id} | ${emp.department}</p>
                    </div>
                `;
                // ប្រើ bind ដើម្បីបញ្ជូន object emp ទៅ function
                card.addEventListener('click', () => selectUser(emp));
                employeeListEl.appendChild(card);
            });
        }

        /**
         * 5. ជ្រើសរើសអ្នកប្រើប្រាស់ (Login)
         * @param {object} employee 
         */
        function selectUser(employee) {
            console.log('User selected:', employee);
            currentUser = employee;
            
            // ប្រើ Employee ID ជា "userId" សម្រាប់ Firestore path
            const firestoreUserId = currentUser.id; 
            
            // **** FIX: Use the PUBLIC data path to avoid permission errors ****
            // The security rules for /users/{userId} require auth.uid == userId,
            // but we are signing in anonymously, so auth.uid will not match the employee ID.
            // We will use the public path instead, which allows writes if auth != null.
            const publicDataPath = `artifacts/${appId}/public/data/attendance/${firestoreUserId}/records`;
            console.log("Using Firestore Path:", publicDataPath);
            attendanceCollectionRef = collection(db, publicDataPath);

            // បំពេញព័ត៌មាន Profile
            welcomeMessage.textContent = `សូមស្វាគមន៍, ${employee.name.split(' ')[0]}`;
            profilePhoto.src = employee.photoUrl || 'https://placehold.co/64x64/e0e0e0/777?text=No+Img';
            profileName.textContent = employee.name;
            profileId.textContent = `អត្តលេខ: ${employee.id}`;
            profileDept.textContent = `ផ្នែក: ${employee.department}`;

            // ប្តូរ View
            userSelectionView.classList.add('hidden');
            userSelectionView.classList.remove('flex');
            mainAppView.classList.remove('hidden');
            mainAppView.classList.add('flex');

            // ចាប់ផ្តើមស្តាប់ទិន្នន័យវត្តមាន
            setupAttendanceListener();
        }

        /**
         * 6. ចាកចេញ (Logout)
         */
        function logout() {
            currentUser = null;
            
            // បញ្ឈប់ការស្តាប់ទិន្នន័យ (unsubscribe)
            if (attendanceListener) {
                attendanceListener();
                attendanceListener = null;
            }
            
            attendanceCollectionRef = null;
            globalAttendanceList = [];
            renderHistory(); // សម្អាត history table
            dateFilter.value = ''; // Reset filter
            searchBar.value = ''; // Reset search
            renderEmployeeList(allEmployees); // បង្ហាញបញ្ជីបុគ្គលិកពេញឡើងវិញ

            // ប្តូរ View
            mainAppView.classList.add('hidden');
            mainAppView.classList.remove('flex');
            userSelectionView.classList.remove('hidden');
            userSelectionView.classList.add('flex');
        }

        /**
         * 7. ស្តាប់ការផ្លាស់ប្តូរទិន្នន័យវត្តមានពី Firestore (Real-time)
         */
        function setupAttendanceListener() {
            if (!attendanceCollectionRef) return;
            
            // បិទ listener ចាស់ (ប្រសិនបើមាន)
            if (attendanceListener) {
                attendanceListener();
            }

            showLoading(true, 'កំពុងទាញប្រវត្តិវត្តមាន...');

            attendanceListener = onSnapshot(attendanceCollectionRef, (querySnapshot) => {
                globalAttendanceList = [];
                querySnapshot.forEach((doc) => {
                    globalAttendanceList.push(doc.data());
                });

                // តម្រៀបទិន្នន័យ (ថ្មីចុងក្រោយគេ)
                // មិនប្រើ orderBy របស់ Firestore ព្រោះត្រូវការ Index
                globalAttendanceList.sort((a, b) => new Date(b.date) - new Date(a.date));

                console.log('Attendance data updated:', globalAttendanceList);
                renderHistory(); // បង្ហាញ History (នឹងប្រើ list ថ្មីនេះ)
                updateButtonState(); // Update ប៊ូតុង Check-in/out
                
                showLoading(false);
                
            }, (error) => {
                console.error("Error listening to attendance:", error);
                showMessage('បញ្ហា', 'មិនអាចស្តាប់ទិន្នន័យវត្តមានបានទេ។', true);
                showLoading(false);
            });
        }

        /**
         * 8. បង្ហាញប្រវត្តិវត្តមាន (និងអនុវត្ត Filter)
         */
        function renderHistory() {
            historyListEl.innerHTML = '';
            const filterValue = dateFilter.value; // យកតម្លៃពី date filter

            let filteredList = globalAttendanceList;
            
            if (filterValue) {
                filteredList = globalAttendanceList.filter(record => record.date === filterValue);
            }

            if (filteredList.length === 0) {
                historyListEl.innerHTML = `<tr><td colspan="3" class="px-4 py-4 text-center text-gray-500">មិនទាន់មានទិន្នន័យ${filterValue ? 'សម្រាប់ថ្ងៃនេះ' : ''}</td></tr>`;
                return;
            }

            filteredList.forEach(record => {
                const checkInTime = formatTime(record.checkIn);
                const checkOutTime = record.checkOut ? formatTime(record.checkOut) : '<span class="text-gray-400">មិនទាន់ចេញ</span>';
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-4 py-3 whitespace-nowrap text-sm font-medium text-gray-800">${record.date}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-green-700">${checkInTime}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm ${record.checkOut ? 'text-red-700' : ''}">${checkOutTime}</td>
                `;
                historyListEl.appendChild(row);
            });
        }
        
        /**
         * 9. Update ស្ថានភាពប៊ូតុង Check-in/Out
         */
        function updateButtonState() {
            const todayString = getTodayDateString();
            const todayData = globalAttendanceList.find(record => record.date === todayString);

            // Reset
            checkInBtn.disabled = false;
            checkOutBtn.disabled = true;
            statusMessage.textContent = 'សូមធ្វើការ Check-in';
            statusMessage.className = 'text-center text-blue-700 mb-6 h-5';

            if (todayData) {
                if (todayData.checkIn) {
                    checkInBtn.disabled = true;
                    checkOutBtn.disabled = false;
                    statusMessage.textContent = `បាន Check-in ម៉ោង: ${formatTime(todayData.checkIn)}`;
                    statusMessage.className = 'text-center text-green-700 mb-6 h-5';
                }
                if (todayData.checkOut) {
                    checkOutBtn.disabled = true;
                    statusMessage.textContent = `បាន Check-out ម៉ោង: ${formatTime(todayData.checkOut)}`;
                    statusMessage.className = 'text-center text-red-700 mb-6 h-5';
                }
            }
        }

        /**
         * 10. ដំណើរការ Check In
         */
        async function handleCheckIn() {
            if (!attendanceCollectionRef) return;
            
            checkInBtn.disabled = true;
            checkOutBtn.disabled = true;
            statusMessage.textContent = 'កំពុងដំណើរការ Check-in...';

            const now = new Date();
            const todayDocId = getTodayDateString(now);
            const data = {
                date: todayDocId,
                checkIn: now.toISOString(),
                checkOut: null // សម្គាល់ថា checkOut មិនទាន់មាន
            };

            try {
                const todayDocRef = doc(attendanceCollectionRef, todayDocId);
                await setDoc(todayDocRef, data); // ប្រើ setDoc ដើម្បីបង្កើត ឬ overwrite
                
                showMessage('ជោគជ័យ', 'បានចុះវត្តមានចូលដោយជោគជ័យ។');
                // onSnapshot នឹង update UI ដោយស្វ័យប្រវត្តិ
                
            } catch (error) {
                console.error("Check In Error:", error);
                showMessage('បញ្ហា', `មិនអាច Check-in បានទេ: ${error.message}`, true);
                updateButtonState(); // Reset ប៊ូតុង
            }
        }

        /**
         * 11. ដំណើរការ Check Out
         */
        async function handleCheckOut() {
            if (!attendanceCollectionRef) return;

            checkInBtn.disabled = true;
            checkOutBtn.disabled = true;
            statusMessage.textContent = 'កំពុងដំណើរការ Check-out...';

            const now = new Date();
            const todayDocId = getTodayDateString(now);
            const data = {
                checkOut: now.toISOString()
            };

            try {
                const todayDocRef = doc(attendanceCollectionRef, todayDocId);
                // ប្រើ updateDoc ព្រោះឯកសារត្រូវតែមាន (ពីការ Check-in)
                await updateDoc(todayDocRef, data); 
                
                showMessage('ជោគជ័យ', 'បានចុះវត្តមានចេញដោយជោគជ័យ។');
                // onSnapshot នឹង update UI ដោយស្វ័យប្រវត្តិ

            } catch (error) {
                console.error("Check Out Error:", error);
                showMessage('បញ្ហា', `មិនអាច Check-out បានទេ: ${error.message}`, true);
                updateButtonState(); // Reset ប៊ូតុង
            }
        }

        // --- Event Listeners ---
        
        // ស្វែងរក
        searchBar.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredEmployees = allEmployees.filter(emp => 
                emp.name.toLowerCase().includes(searchTerm) ||
                emp.id.toLowerCase().includes(searchTerm)
            );
            renderEmployeeList(filteredEmployees);
        });

        // ត្រងតាមកាលបរិច្ឆេទ
        dateFilter.addEventListener('change', renderHistory);

        // ប៊ូតុង
        logoutBtn.addEventListener('click', logout);
        checkInBtn.addEventListener('click', handleCheckIn);
        checkOutBtn.addEventListener('click', handleCheckOut);
        messageCloseBtn.addEventListener('click', closeMessage);

        // --- Initial Call ---
        // ចាប់ផ្តើមកម្មវិធីពេល DOM ដំណើរការ
        document.addEventListener('DOMContentLoaded', initializeAppFirebase);

    </script>
</body>
</html>
