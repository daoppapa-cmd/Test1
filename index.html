<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>កម្មវិធីស្កេនវត្តមាន</title>
    <!-- ប្រើ Tailwind CSS សម្រាប់ Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ប្រើ Noto Sans Khmer សម្រាប់ Font ភាសាខ្មែរ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* កំណត់ Font គោលជា Noto Sans Khmer */
        body {
            font-family: 'Noto Sans Khmer', sans-serif;
        }
        /* Style សម្រាប់ Loading Spinner */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- កំណត់ទំហំ App ដូចទូរស័ព្ទ (Mobile View) -->
    <div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-lg flex flex-col">

        <!-- 1. អេក្រង់ Loading (ពេលទាញទិន្នន័យ) -->
        <div id="loading-screen" class="flex flex-col items-center justify-center flex-1 p-6">
            <div class="loader mb-4"></div>
            <p class="text-gray-600 text-lg">កំពុងទាញទិន្នន័យ...</p>
            <p id="auth-status" class="text-sm text-gray-500 mt-2"></p>
        </div>

        <!-- 2. អេក្រង់ជ្រើសរើសបុគ្គលិក (Login) -->
        <div id="selection-screen" class="hidden flex-1 flex-col p-4">
            <h1 class="text-2xl font-bold text-center text-blue-700 mb-4">ស្វែងរកគណនីរបស់អ្នក</h1>
            <div class="mb-4">
                <input type="search" id="search-bar" placeholder="ស្វែងរកតាមឈ្មោះ ឬអត្តលេខ..." class="w-full px-4 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div id="employee-list" class="flex-1 overflow-y-auto space-y-3 pr-2">
                <!-- បញ្ជីបុគ្គលិកនឹងបង្ហាញនៅទីនេះ -->
            </div>
        </div>

        <!-- 3. អេក្រង់ Dashboard សម្រាប់ Check-in/Check-out -->
        <div id="dashboard-screen" class="hidden flex-1 flex-col">
            <!-- ប៊ូតុងត្រឡប់ក្រោយ -->
            <header class="bg-blue-700 text-white p-4 shadow-md relative">
                <button id="logout-button" class="absolute top-0 left-0 mt-3 ml-3 p-2 rounded-full hover:bg-blue-800">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
                <h1 class="text-xl font-bold text-center">ប្រព័ន្ធស្កេនវត្តមាន</h1>
            </header>
            
            <!-- ព័ត៌មានបុគ្គលិក -->
            <div class="p-6 flex flex-col items-center border-b">
                <img id="user-photo" src="https://placehold.co/100x100/e2e8f0/e2e8f0?text=Photo" 
                     onerror="this.src='https://placehold.co/100x100/e2e8f0/cbd5e1?text=No+Photo'"
                     class="w-24 h-24 rounded-full object-cover border-4 border-gray-200 shadow-lg mb-4">
                <h2 id="user-name" class="text-2xl font-bold text-gray-800"></h2>
                <p id="user-id" class="text-sm text-gray-500"></p>
                <p id="user-dept" class="text-md text-blue-600 font-medium mt-1"></p>
            </div>

            <!-- ប៊ូតុង Check-in / Check-out -->
            <div class="grid grid-cols-2 gap-4 p-6">
                <button id="check-in-btn" class="flex flex-col items-center justify-center bg-green-500 text-white p-6 rounded-lg shadow-lg hover:bg-green-600 transition duration-300 transform hover:scale-105">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h5a3 3 0 013 3v1" />
                    </svg>
                    <span class="text-lg font-bold">ចុះឈ្មោះចូល</span>
                </button>
                <button id="check-out-btn" class="flex flex-col items-center justify-center bg-red-500 text-white p-6 rounded-lg shadow-lg hover:bg-red-600 transition duration-300 transform hover:scale-105">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m5 4v1a3 3 0 003 3h2a3 3 0 003-3V7a3 3 0 00-3-3h-2a3 3 0 00-3 3v1" />
                    </svg>
                    <span class="text-lg font-bold">ចុះឈ្មោះចេញ</span>
                </button>
            </div>

            <!-- ប្រវត្តិ (History) -->
            <div class="flex-1 p-6 pt-0">
                <h3 class="text-lg font-semibold mb-3 text-gray-700">ប្រវត្តិវត្តមានថ្ងៃនេះ</h3>
                <div id="history-list" class="space-y-2 overflow-y-auto h-48 bg-gray-50 p-3 rounded-lg border">
                    <!-- ប្រវត្តិនឹងបង្ហាញនៅទីនេះ -->
                    <p class="text-gray-500 text-center">មិនទាន់មានទិន្នន័យ</p>
                </div>
            </div>
        </div>

    </div> <!-- /end #app-container -->

    <!-- 4. Modal/Message Box (Hidden by default) -->
    <div id="message-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-sm text-center">
            <h3 id="modal-title" class="text-lg font-bold mb-4"></h3>
            <p id="modal-message" class="text-gray-700 mb-6"></p>
            <button id="modal-close-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                បិទ
            </button>
        </div>
    </div>


    <!-- Firebase SDK -->
    <script type="module">
        // នាំចូល Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInAnonymously, 
            signInWithCustomToken, 
            onAuthStateChanged,
            setPersistence,
            browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            addDoc, 
            collection, 
            query, 
            where, 
            onSnapshot,
            Timestamp,
            setLogLevel
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 1. Firebase Configuration (ប្រើ Environment Variables ដូចក្នុង Guideline)
        const firebaseConfigFromEnv = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : null;
        
        // ប្រើ Config ដែល User ផ្ដល់ឲ្យ ប្រសិនបើ __firebase_config មិនមាន
        const finalFirebaseConfig = firebaseConfigFromEnv || {
             apiKey: "AIzaSyA3LPVD0nRfMuEoQSCs5HiwztRmlWqw--c",
             authDomain: "checkinme-305e8.firebaseapp.com",
             projectId: "checkinme-305e8",
             storageBucket: "checkinme-305e8.firebasestorage.app",
             messagingSenderId: "702908288371",
             appId: "1:702908288371:web:bb067e1a238bd1e5288906",
             measurementId: "G-ZFFWRTD6QE"
        };
        
        // 2. Google Sheet Configuration
        const SHEET_ID = '1eRyPoifzyvB4oBmruNyXcoKMKPRqjk6xDD6-bPNW6pc';
        const SHEET_NAME = 'DIList';
        // យើងទាញទិន្នន័យពីជួរ E ដល់ AA (E=0, L=7, R=13, AA=22)
        const SHEET_RANGE = 'E9:AA'; 
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}&range=${SHEET_RANGE}`;

        // 3. App ID (ប្រើ Environment Variable)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-checkin-app';

        // 4. Firebase Services
        let app, auth, db;

        // 5. App State
        let allEmployees = [];
        let selectedEmployee = null;
        let userId = null;
        let unsubscribeHistory = null; // សម្រាប់បិទ listener
        let hasCheckedInToday = false; // ត្រួតពិនិត្យស្ថានភាពស្កេនចូល
        let hasCheckedOutToday = false; // ត្រួតពិនិត្យស្ថានភាពស្កេនចេញ

        // 6. DOM Elements
        const loadingScreen = document.getElementById('loading-screen');
        const authStatus = document.getElementById('auth-status');
        const selectionScreen = document.getElementById('selection-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const searchBar = document.getElementById('search-bar');
        const employeeList = document.getElementById('employee-list');
        const logoutButton = document.getElementById('logout-button');
        const userPhoto = document.getElementById('user-photo');
        const userName = document.getElementById('user-name');
        const userIdElem = document.getElementById('user-id');
        const userDept = document.getElementById('user-dept');
        const checkInBtn = document.getElementById('check-in-btn');
        const checkOutBtn = document.getElementById('check-out-btn');
        const historyList = document.getElementById('history-list');

        // Modal Elements
        const messageModal = document.getElementById('message-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        // 7. Helper Function (សម្រាប់បង្ហាញ/លាក់ Screen)
        function showScreen(screenId) {
            loadingScreen.classList.add('hidden');
            selectionScreen.classList.add('hidden');
            dashboardScreen.classList.add('hidden');

            if (screenId === 'loading') {
                loadingScreen.classList.remove('hidden');
            } else if (screenId === 'selection') {
                selectionScreen.classList.remove('hidden');
                selectionScreen.classList.add('flex');
            } else if (screenId === 'dashboard') {
                dashboardScreen.classList.remove('hidden');
                dashboardScreen.classList.add('flex');
            }
        }

        // Helper function for Modal
        function showModal(title, message) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            messageModal.classList.remove('hidden');
        }

        // Add event listener for modal close button
        modalCloseBtn.addEventListener('click', () => {
            messageModal.classList.add('hidden');
        });

        // Helper function to get local YYYY-MM-DD
        function getLocalISODate() {
            const date = new Date();
            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 8. Main Function (ពេលបើកទំព័រ)
        window.onload = function() {
            if (!finalFirebaseConfig.apiKey) {
                loadingScreen.innerHTML = '<p class="text-red-500">Error: Firebase configuration is missing.</p>';
                return;
            }
            try {
                app = initializeApp(finalFirebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                setLogLevel('Debug'); // សម្រាប់ Debug
                
                // ព្យាយាមរក្សាការ Login
                setPersistence(auth, browserLocalPersistence)
                    .then(() => {
                        initFirebaseAuth();
                    })
                    .catch((error) => {
                        console.error("Error setting auth persistence: ", error);
                        initFirebaseAuth(); // បន្តដំណើរការធម្មតា
                    });
            } catch (e) {
                console.error("Error initializing Firebase:", e);
                loadingScreen.innerHTML = `<p class="text-red-500">Error: Could not initialize Firebase. ${e.message}</p>`;
            }
        };

        // 9. Firebase Authentication
        function initFirebaseAuth() {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    userId = user.uid;
                    authStatus.textContent = "បានផ្ទៀងផ្ទាត់... កំពុងទាញបញ្ជីឈ្មោះ... ";
                    console.log("Firebase User ID:", userId);
                    // ពេល Auth ដំណើរការ, ទាញទិន្នន័យពី Google Sheet
                    fetchEmployeeData();
                } else {
                    authStatus.textContent = "កំពុងផ្ទៀងផ្ទាត់គណនី...";
                    signInUser();
                }
            });
        }

        async function signInUser() {
            try {
                // ប្រើ __initial_auth_token ប្រសិនបើមាន
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    console.log("Signing in with custom token...");
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    // បើមិនមាន, ប្រើ Anonymous
                    console.log("Signing in anonymously...");
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Authentication Error:", error);
                authStatus.textContent = `Authentication Failed: ${error.message}`;
            }
        }

        // 10. Fetch Data ពី Google Sheet
        async function fetchEmployeeData() {
            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                let text = await response.text();
                // ទិន្នន័យពី Google Viz API ត្រូវតែកាត់តួអក្សរខាងដើម និងខាងចុង
                const jsonText = text.substring(text.indexOf('(') + 1, text.lastIndexOf(')'));
                const data = JSON.parse(jsonText);
                
                if (!data.table || !data.table.rows) {
                    throw new Error("Invalid Google Sheet data format.");
                }

                const rows = data.table.rows;
                // Mapping ទិន្នន័យ (E=c[0], L=c[7], R=c[13], AA=c[22])
                allEmployees = rows.map(row => ({
                    id: row.c[0]?.v || 'N/A', // Column E
                    name: row.c[7]?.v || 'Unknown Name', // Column L
                    department: row.c[13]?.v || 'N/A', // Column R
                    photo: row.c[22]?.v || null // Column AA
                })).filter(emp => emp.id !== 'N/A' && emp.name !== 'Unknown Name'); // តម្រងយកតែអ្នកមានទិន្នន័យ
                
                console.log(`Fetched ${allEmployees.length} employees.`);
                renderEmployeeList(allEmployees);
                showScreen('selection');

            } catch (error) {
                console.error("Error fetching Google Sheet data:", error);
                loadingScreen.innerHTML = `<p class="text-red-500">Error: Could not fetch employee list. ${error.message}</p>`;
            }
        }

        // 11. Render បញ្ជីបុគ្គលិក
        function renderEmployeeList(employees) {
            employeeList.innerHTML = ''; // សម្អាតបញ្ជីចាស់
            if (employees.length === 0) {
                employeeList.innerHTML = '<p class="text-gray-500 text-center">មិនមានទិន្នន័យ</p>';
                return;
            }
            
            employees.forEach(emp => {
                const empCard = document.createElement('div');
                empCard.className = "flex items-center p-3 bg-white border rounded-lg shadow-sm hover:bg-gray-50 cursor-pointer";
                empCard.onclick = () => handleEmployeeSelect(emp);

                const photoUrl = emp.photo ? emp.photo : 'https://placehold.co/64x64/e2e8f0/cbd5e1?text=No+Photo';
                
                empCard.innerHTML = `
                    <img src="${photoUrl}" 
                         onerror="this.src='https://placehold.co/64x64/e2e8f0/cbd5e1?text=Error'"
                         class="w-12 h-12 rounded-full object-cover mr-4 border">
                    <div class="flex-1">
                        <p class="font-bold text-gray-800">${emp.name}</p>
                        <p class="text-sm text-gray-600">ID: ${emp.id} | ផ្នែក: ${emp.department}</p>
                    </div>
                `;
                employeeList.appendChild(empCard);
            });
        }

        // 12. មុខងារស្វែងរក
        searchBar.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredEmployees = allEmployees.filter(emp => 
                emp.name.toLowerCase().includes(searchTerm) || 
                emp.id.toLowerCase().includes(searchTerm)
            );
            renderEmployeeList(filteredEmployees);
        });

        // 13. ពេលជ្រើសរើសបុគ្គលិក
        function handleEmployeeSelect(employee) {
            selectedEmployee = employee;
            console.log("Selected Employee:", selectedEmployee);

            // បង្ហាញព័ត៌មានក្នុង Dashboard
            userPhoto.src = selectedEmployee.photo || 'https://placehold.co/100x100/e2e8f0/cbd5e1?text=No+Photo';
            userName.textContent = selectedEmployee.name;
            userIdElem.textContent = `អត្តលេខ: ${selectedEmployee.id}`;
            userDept.textContent = `ផ្នែក: ${selectedEmployee.department}`;

            // បើក History listener
            setupHistoryListener();
            
            // បញ្ជាក់ស្ថានភាពប៊ូតុងពេលចាប់ផ្តើម
            updateButtonStates();

            // បង្ហាញ Dashboard
            showScreen('dashboard');
        }

        // 14. ត្រឡប់ក្រោយ (Logout)
        logoutButton.addEventListener('click', () => {
            selectedEmployee = null;
            // បិទ History listener
            if (unsubscribeHistory) {
                unsubscribeHistory();
                unsubscribeHistory = null;
            }
            // Reset ស្ថានភាព
            hasCheckedInToday = false;
            hasCheckedOutToday = false;
            updateButtonStates(); // ហៅ Afer Reset
            
            showScreen('selection');
        });

        // 15. ប៊ូតុង Check-in / Check-out
        checkInBtn.addEventListener('click', () => handleCheckInOrOut('check-in'));
        checkOutBtn.addEventListener('click', () => handleCheckInOrOut('check-out'));

        async function handleCheckInOrOut(type) {
            if (!selectedEmployee || !userId) {
                console.error("No selected employee or user ID");
                return;
            }

            // --- VALIDATION ---
            if (type === 'check-in' && hasCheckedInToday) {
                console.warn("Already checked in today.");
                showModal("បានស្កេនរួចហើយ", "អ្នកបានធ្វើការស្កេនចូលម្ដងរួចមកហើយសម្រាប់ថ្ងៃនេះ។");
                return; // បញ្ឈប់ការដំណើរការ
            }
            if (type === 'check-out' && hasCheckedOutToday) {
                console.warn("Already checked out today.");
                showModal("បានស្កេនរួចហើយ", "អ្នកបានធ្វើការស្កេនចេញម្ដងរួចមកហើយសម្រាប់ថ្ងៃនេះ។");
                return; // បញ្ឈប់ការដំណើរការ
            }

            // បិទប៊ូតុងបណ្ដោះអាសន្ន
            checkInBtn.disabled = true;
            checkOutBtn.disabled = true;

            const now = new Date();
            const today = getLocalISODate(); // យកតែ 'YYYY-MM-DD' (Local Time)

            const record = {
                employeeId: selectedEmployee.id,
                employeeName: selectedEmployee.name,
                type: type,
                timestamp: Timestamp.fromDate(now), // ប្រើ Firebase Timestamp
                day: today // សម្រាប់ងាយស្រួល Query
            };

            try {
                // រក្សាទុកក្នុង Public Collection
                const collectionPath = `artifacts/${appId}/public/data/employee_check_ins`;
                const docRef = await addDoc(collection(db, collectionPath), record);
                console.log("Document written with ID: ", docRef.id);
            } catch (error) {
                console.error("Error adding document: ", error);
            } finally {
                // បើកប៊ូតុងវិញ (onSnapshot នឹង update វាម្តងទៀត តែនេះជាការធានា)
                updateButtonStates();
            }
        }

        // 16. បង្កើត History Listener (Real-time)
        function setupHistoryListener() {
            // បិទ Listener ចាស់ (ប្រសិនបើមាន)
            if (unsubscribeHistory) {
                unsubscribeHistory();
            }

            if (!userId || !selectedEmployee) return;

            // --- ការកែសម្រួលចុងក្រោយ ---
            // 'today' ត្រូវបានផ្លាស់ទីទៅក្នុង onSnapshot 
            
            const collectionPath = `artifacts/${appId}/public/data/employee_check_ins`;

            // Query យកតែទិន្នន័យរបស់ Employee ដែលបានជ្រើសរើស
            const q = query(collection(db, collectionPath), where("employeeId", "==", selectedEmployee.id));

            unsubscribeHistory = onSnapshot(q, (snapshot) => {
                
                // *** ការកែសម្រួលសំខាន់ ***
                // គណនា 'today' ឡើងវិញ រាល់ពេល onSnapshot ដំណើរការ
                // នេះធានាថាគ្រប់ឧបករណ៍ទាំងអស់ ប្រើ "ថ្ងៃ" ដូចគ្នា
                const today = getLocalISODate(); 
                
                const allRecords = [];
                snapshot.forEach((doc) => {
                    allRecords.push(doc.data());
                });

                // Filter យកតែថ្ងៃនេះ (ដោយប្រើ 'today' ដែលទើបគណនា)
                const todayRecords = allRecords
                    .filter(r => r.day === today)
                    .sort((a, b) => a.timestamp.seconds - b.timestamp.seconds); 
                
                // --- LOGIC សម្រាប់ត្រួតពិនិត្យស្ថានភាព ---
                // Reset flags ជាមុនសិន
                hasCheckedInToday = false;
                hasCheckedOutToday = false;

                // ពិនិត្យមើល Records របស់ថ្ងៃនេះ
                for (const record of todayRecords) {
                    if (record.type === 'check-in') {
                        hasCheckedInToday = true;
                    }
                    if (record.type === 'check-out') {
                        hasCheckedOutToday = true;
                    }
                }

                renderHistory(todayRecords);
                updateButtonStates(); // ធ្វើបច្ចុប្បន្នភាពប៊ូតុង បន្ទាប់ពីពិនិត្យស្ថានភាព

            }, (error) => {
                console.error("Error with history snapshot: ", error);
                historyList.innerHTML = `<p class="text-red-500">Error loading history.</p>`;
            });
        }

        // 17. Render ប្រវត្តិ
        function renderHistory(records) {
            historyList.innerHTML = ''; // សម្អាត
            if (records.length === 0) {
                historyList.innerHTML = '<p class="text-gray-500 text-center">មិនទាន់មានទិន្នន័យសម្រាប់ថ្ងៃនេះ</p>';
                return;
            }

            records.forEach(record => {
                const recordDiv = document.createElement('div');
                recordDiv.className = 'flex justify-between items-center p-2 bg-white rounded border';
                
                const typeText = record.type === 'check-in' ? 'ចូល' : 'ចេញ';
                const typeColor = record.type === 'check-in' ? 'text-green-600' : 'text-red-600';
                
                // បំប្លែង Timestamp ទៅជាម៉ោង
                const time = record.timestamp.toDate().toLocaleTimeString('en-US', { hour12: false });

                recordDiv.innerHTML = `
                    <span class="font-medium ${typeColor}">
                        <strong class="font-bold">[${typeText}]</strong>
                    </span>
                    <span class="text-gray-700 font-mono">${time}</span>
                `;
                historyList.appendChild(recordDiv);
            });
        }

        // 18. អនុគមន៍ថ្មី សម្រាប់ធ្វើបច្ចុប្បន្នភាពប៊ូតុង
        function updateButtonStates() {
            // 1. កំណត់ស្ថានភាពប៊ូតុង Check-in
            if (hasCheckedInToday) {
                checkInBtn.disabled = true;
                checkInBtn.classList.remove('bg-green-500', 'hover:bg-green-600');
                checkInBtn.classList.add('bg-gray-400', 'cursor-not-allowed', 'opacity-70');
                checkInBtn.querySelector('span').textContent = 'បានស្កេនចូល';
            } else {
                checkInBtn.disabled = false;
                checkInBtn.classList.add('bg-green-500', 'hover:bg-green-600');
                checkInBtn.classList.remove('bg-gray-400', 'cursor-not-allowed', 'opacity-70');
                checkInBtn.querySelector('span').textContent = 'ចុះឈ្មោះចូល';
            }

            // 2. កំណត់ស្ថានភាពប៊ូតុង Check-out
            if (hasCheckedOutToday) {
                checkOutBtn.disabled = true;
                checkOutBtn.classList.remove('bg-red-500', 'hover:bg-red-600');
                checkOutBtn.classList.add('bg-gray-400', 'cursor-not-allowed', 'opacity-70');
                checkOutBtn.querySelector('span').textContent = 'បានស្កេនចេញ';
            } else {
                checkOutBtn.disabled = false;
                checkOutBtn.classList.add('bg-red-500', 'hover:bg-red-600');
                checkOutBtn.classList.remove('bg-gray-400', 'cursor-not-allowed', 'opacity-70');
                checkOutBtn.querySelector('span').textContent = 'ចុះឈ្មោះចេញ';
            }
        }

    </script>
</body>
